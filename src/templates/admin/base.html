<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin | SigmaHQ RAG{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>SigmaHQ RAG</h2>
                <p>Admin Panel</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin" class="{% if request.url.path == '/admin' %}active{% endif %}">
                    Dashboard
                </a>
                <a href="/admin/models" class="{% if request.url.path.startswith('/admin/models') %}active{% endif %}">
                    Models
                </a>
                <a href="/admin/settings" class="{% if request.url.path == '/admin/settings' %}active{% endif %}">
                    Settings
                </a>
                <a href="/chat" class="nav-link">
                    ← Back to Chat
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>{% block header %}Admin Dashboard{% endblock %}</h1>
            </header>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
