{% extends "admin/base.html" %}

{% block title %}Settings | Admin | SigmaHQ RAG{% endblock %}

{% block header %}Settings{% endblock %}

{% block content %}
<div class="card">
    <h2>Configuration</h2>
    <form id="settings-form" onsubmit="saveSettings(event)">
        <div class="form-group">
            <label>LLM Base URL</label>
            <input type="text" id="llm-url" value="http://localhost:11434" class="form-control">
        </div>
        <div class="form-group">
            <label>LLM Model Name</label>
            <input type="text" id="llm-model" value="llama3.2" class="form-control">
        </div>
        <div class="form-group">
            <label>Qdrant Host</label>
            <input type="text" id="qdrant-host" value="localhost" class="form-control">
        </div>
        <div class="form-group">
            <label>Qdrant Port</label>
            <input type="number" id="qdrant-port" value="6333" class="form-control">
        </div>
        <div class="form-group">
            <label>Collection Name</label>
            <input type="text" id="collection-name" value="sigma_rules" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
    <div id="settings-status" class="alert" style="display:none;"></div>
</div>

<script>
async function loadSettings() {
    const resp = await fetch('/api/v1/admin/config');
    const data = await resp.json();

    if (data.config) {
        const services = data.config.services || {};
        const llm = services.llama || {};
        const qdrant = services.qdrant || {};

        document.getElementById('llm-url').value = llm.base_url || 'http://localhost:11434';
        document.getElementById('llm-model').value = llm.model_name || 'llama3.2';
        document.getElementById('qdrant-host').value = qdrant.host || 'localhost';
        document.getElementById('qdrant-port').value = qdrant.port || 6333;
        document.getElementById('collection-name').value = qdrant.collection_name || 'sigma_rules';
    }
}

async function saveSettings(event) {
    event.preventDefault();

    const config = {
        services: {
            llama: {
                base_url: document.getElementById('llm-url').value,
                model_name: document.getElementById('llm-model').value
            },
            qdrant: {
                host: document.getElementById('qdrant-host').value,
                port: parseInt(document.getElementById('qdrant-port').value),
                collection_name: document.getElementById('collection-name').value
            }
        }
    };

    const resp = await fetch('/api/v1/admin/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(config)
    });
    const data = await resp.json();

    const statusEl = document.getElementById('settings-status');
    statusEl.style.display = 'block';
    if (resp.ok) {
        statusEl.className = 'alert alert-success';
        statusEl.textContent = 'Settings saved successfully!';
    } else {
        statusEl.className = 'alert alert-error';
        statusEl.textContent = data.message || 'Failed to save settings';
    }
}

document.addEventListener('DOMContentLoaded', loadSettings);
</script>
{% endblock %}
