{% extends "base.html" %}

{% block title %}Chat - SigmaHQ RAG{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', path='/css/chat.css') }}">
{% endblock %}

{% block content %}
<div class="chat-layout">
    <div class="chat-header-bar">
        <span class="chat-header-title">SigmaHQ RAG</span>
        <div class="chat-header-actions">
            <button class="chat-header-btn" id="new-chat-btn" title="Nouvelle discussion">+ Nouvelle discussion</button>
        </div>
    </div>
    <div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-label="Messages du chat">
        <div class="chat-welcome" id="chat-welcome">
            <h2>SigmaHQ RAG</h2>
            <p>Ask questions about Sigma detection rules</p>
        </div>
        <div class="typing-indicator" id="typing-indicator" hidden>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>
    </div>
    <div class="chat-input-bar">
        <form id="chat-form">
            <textarea id="message-input" placeholder="Ask a question..." rows="1"></textarea>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="{{ url_for('static', path='/js/chat.js') }}"></script>
{% endblock %}
