{% extends "logs/base.html" %}

{% block content %}
<div id="logs-header">
    <h2>System Logs</h2>
    <div class="logs-header-controls">
        <input type="text" id="log-search" placeholder="Filter logs..." />
        <button id="pause-btn" class="btn btn-secondary btn-sm" onclick="togglePause()">Pause</button>
        <button id="clear-btn" class="btn btn-secondary btn-sm" onclick="clearLogs()">Clear</button>
    </div>
</div>
<div id="logs-output" class="logs-output"></div>
<div id="log-stats" class="log-stats">0 lines</div>
{% endblock %}
