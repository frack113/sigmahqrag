{% extends "admin/base.html" %}

{% block title %}Models | Admin | SigmaHQ RAG{% endblock %}

{% block header %}Model Management{% endblock %}

{% block content %}
<div class="card">
    <h3>Installed LLM Models</h3>
    <button class="btn btn-secondary" onclick="loadModels()" style="float:right;">Refresh</button>
    <div id="llm-models">
        <p>Loading...</p>
    </div>
</div>

<div class="card">
    <h3>Installed Embedding Models</h3>
    <div id="embedding-models">
        <p>Loading...</p>
    </div>
</div>

<div class="card">
    <h3>Download New Model from HuggingFace</h3>
    <div class="form-group">
        <label for="model-search">Search:</label>
        <input type="text" id="model-search" placeholder="ex: llama, gemma, qwen">
        <button class="btn btn-primary" onclick="searchModels()">Search</button>
    </div>
    <div id="search-results"></div>
    <div id="download-status" class="status-message"></div>
</div>

<script>
function loadModels() {
    fetch('/api/v1/admin/models')
        .then(r => r.json())
        .then(data => {
            const models = data.data?.models || [];
            if (models.length === 0) {
                document.getElementById('llm-models').innerHTML = '<p>No models installed.</p>';
                return;
            }
            let html = '<table><tr><th>Model</th><th>Size</th><th>Actions</th></tr>';
            models.forEach(m => {
                html += `<tr>
                    <td>${m.repo_id}</td>
                    <td>${Math.round(m.size_mb)}MB</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteModel('${m.repo_id}', '${m.filename}')">Delete</button></td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('llm-models').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('llm-models').innerHTML = '<p class="error">Failed to load models</p>';
        });
    
    // Embeddings
    fetch('/embeddings/installed')
        .then(r => r.json())
        .then(data => {
            const models = data.models || [];
            if (models.length === 0) {
                document.getElementById('embedding-models').innerHTML = '<p>No embedding models installed.</p>';
                return;
            }
            let html = '<table><tr><th>Model</th><th>Actions</th></tr>';
            models.forEach(m => {
                html += `<tr>
                    <td>${m.repo_id}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteEmbedding('${m.repo_id}')">Delete</button></td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('embedding-models').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('embedding-models').innerHTML = '<p class="error">Failed to load embeddings</p>';
        });
}

function searchModels() {
    const query = document.getElementById('model-search').value.trim();
    if (!query) return;
    
    document.getElementById('search-results').innerHTML = '<p>Searching...</p>';
    
    fetch(`/admin/llm/?action=list&repo_id=${encodeURIComponent(query)}`)
        .then(r => r.json())
        .then(data => {
            const files = data.files || [];
            if (files.length === 0) {
                document.getElementById('search-results').innerHTML = '<p>No files found.</p>';
                return;
            }
            let html = '<p><strong>Available files:</strong></p><ul>';
            files.forEach(f => {
                html += `<li>${f.filename} (${Math.round(f.size/1024/1024)}MB)</li>`;
            });
            html += '</ul>';
            document.getElementById('search-results').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('search-results').innerHTML = '<p class="error">Search failed: ' + err + '</p>';
        });
}

function deleteModel(repoId, filename) {
    if (!confirm(`Delete ${repoId}/${filename}?`)) return;
    
    fetch('/api/v1/admin/models/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({repo_id: repoId, filename: filename})
    })
    .then(r => r.json())
    .then(data => {
        alert(data.message || 'Deleted');
        loadModels();
    });
}

function deleteEmbedding(repoId) {
    if (!confirm(`Delete embedding ${repoId}?`)) return;
    alert('Not implemented yet');
}

document.addEventListener('DOMContentLoaded', function() {
    loadModels();
});
</script>

<style>
.form-group {
    margin-bottom: 15px;
}
.form-group label {
    display: inline-block;
    width: 100px;
    font-weight: bold;
}
.form-group input {
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    min-width: 200px;
}
table {
    width: 100%;
    border-collapse: collapse;
}
table th, table td {
    padding: 8px;
    border: 1px solid #ddd;
    text-align: left;
}
table th {
    background: #f8f9fa;
}
.status-message {
    margin-top: 15px;
    padding: 10px;
    border-radius: 4px;
}
.status-message.success {
    background: #d4edda;
    color: #155724;
}
.status-message.error {
    background: #f8d7da;
    color: #721c24;
}
</style>
{% endblock %}
