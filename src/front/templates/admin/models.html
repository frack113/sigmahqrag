{% extends "admin/base.html" %}

{% block title %}Models | Admin | SigmaHQ RAG{% endblock %}

{% block header %}Model Management{% endblock %}

{% block content %}

<div class="card">
  <h3>LLM Model</h3>
  <div id="llm-model">
    <p>Loading...</p>
  </div>
</div>

<div class="card">
  <h3>Embedding Model</h3>
  <div id="embedding-model">
    <p>Loading...</p>
  </div>
</div>

<script>
function loadModels() {
  fetch('/api/v1/models/llm/installed')
    .then(r => r.json())
    .then(data => {
      const models = data.models || [];
      const el = document.getElementById('llm-model');
      if (models.length === 0) {
        el.innerHTML = '<p>No LLM model installed.</p>' + downloadForm('llm');
        return;
      }
      const m = models[0];
      const f = (m.files || [])[0] || {};
      const size = Math.round((f.size || 0) / 1024 / 1024) || '?';
      const name = f.filename || m.repo_id;
      el.innerHTML = `
        <p><strong>${escHtml(name)}</strong> (${size} MB)</p>
        <p>
          <button class="btn btn-danger btn-sm" onclick="deleteLLM('${escAttr(m.repo_id)}', '${escAttr(f.filename || '')}')">Delete</button>
          <button class="btn btn-primary btn-sm" onclick="showDownload('llm')">Replace</button>
        </p>
        <div id="llm-download" style="display:none">${downloadForm('llm')}</div>`;
    })
    .catch(() => {
      document.getElementById('llm-model').innerHTML = '<p class="error">Failed to load</p>';
    });

  fetch('/api/v1/models/embedding/installed')
    .then(r => r.json())
    .then(data => {
      const modelsObj = data.models || {};
      const models = Array.isArray(modelsObj) ? modelsObj : Object.entries(modelsObj).map(([repo_id, info]) => ({ repo_id, ...info }));
      const el = document.getElementById('embedding-model');
      if (models.length === 0) {
        el.innerHTML = '<p>No embedding model installed.</p>' + downloadForm('embedding');
        return;
      }
      const m = models[0];
      el.innerHTML = `
        <p><strong>${escHtml(m.repo_id)}</strong></p>
        <p>
          <button class="btn btn-danger btn-sm" onclick="deleteEmbedding('${escAttr(m.repo_id)}')">Delete</button>
          <button class="btn btn-primary btn-sm" onclick="showDownload('embedding')">Replace</button>
        </p>
        <div id="embedding-download" style="display:none">${downloadForm('embedding')}</div>`;
    })
    .catch(() => {
      document.getElementById('embedding-model').innerHTML = '<p class="error">Failed to load</p>';
    });
}

function downloadForm(type) {
  const label = type === 'llm' ? 'LLM Model' : 'Embedding Model';
  return `
    <div class="form-group">
      <label>HuggingFace ID:</label>
      <input type="text" id="${type}-repo-id" placeholder="org/model" style="width:350px">
      <button class="btn btn-secondary btn-sm" onclick="startDownload('${type}')">Download</button>
    </div>
    <div id="${type}-progress" style="display:none">
      <progress id="${type}-progress-bar" value="0" max="100" style="width:100%"></progress>
      <p id="${type}-progress-text">Starting...</p>
    </div>`;
}

function showDownload(type) {
  const el = document.getElementById(type + '-download');
  if (el) el.style.display = 'block';
}

function startDownload(type) {
  const repoId = document.getElementById(type + '-repo-id').value.trim();
  if (!repoId) { alert('Enter a HuggingFace model ID'); return; }

  const basePath = type === 'embedding' ? '/api/v1/models/embedding' : '/api/v1/models/llm';
  const url = basePath + '/download?repo_id=' + encodeURIComponent(repoId);

  document.getElementById(type + '-progress').style.display = 'block';
  document.getElementById(type + '-progress-bar').value = 0;
  document.getElementById(type + '-progress-text').textContent = 'Deleting old model and downloading...';

  const poll = setInterval(() => {
    fetch(basePath + '/progress?repo_id=' + encodeURIComponent(repoId))
      .then(r => r.json())
      .then(d => {
        const p = d.progress || 0;
        document.getElementById(type + '-progress-bar').value = p;
        document.getElementById(type + '-progress-text').textContent = 'Downloading... ' + p + '%';
        if (p >= 100 || d.status === 'completed') {
          clearInterval(poll);
          document.getElementById(type + '-progress-text').textContent = 'Complete!';
          setTimeout(loadModels, 2000);
        }
      });
  }, 2000);

  fetch(url, { method: 'POST' })
    .then(r => r.json())
    .then(d => { if (!d.success) { clearInterval(poll); document.getElementById(type + '-progress-text').textContent = 'Failed: ' + d.error; } })
    .catch(e => { clearInterval(poll); document.getElementById(type + '-progress-text').textContent = 'Error: ' + e.message; });
}

function deleteLLM(repoId, filename) {
  if (!confirm('Delete this LLM model?')) return;
  fetch('/api/v1/admin/models/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ repo_id: repoId, filename: filename }),
  })
  .then(r => r.json())
  .then(d => { alert(d.status === 'success' ? 'Deleted' : (d.error || 'Error')); loadModels(); })
  .catch(e => { alert('Error: ' + e.message); });
}

function deleteEmbedding(repoId) {
  if (!confirm('Delete this embedding model?')) return;
  fetch('/api/v1/admin/models/delete-embedding', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ repo_id: repoId }),
  })
  .then(r => r.json())
  .then(d => { alert(d.status === 'success' ? 'Deleted' : (d.error || 'Error')); loadModels(); })
  .catch(e => { alert('Error: ' + e.message); });
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

document.addEventListener('DOMContentLoaded', loadModels);
</script>
{% endblock %}
