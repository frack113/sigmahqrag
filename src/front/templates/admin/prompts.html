{% extends "admin/base.html" %}

{% block title %}Prompts | Admin | SigmaHQ RAG{% endblock %}

{% block header %}System Prompts{% endblock %}

{% block content %}
<div class="card">
    <h2>Active Prompt</h2>
    <div id="active-prompt">
        <p>Loading...</p>
    </div>
    <button class="btn btn-secondary" onclick="loadPrompts()">Refresh</button>
</div>

<div class="card">
    <h2>Available Prompts</h2>
    <select id="prompt-select" onchange="loadPromptContent()">
        <option value="">Select a prompt...</option>
    </select>
    <div id="prompt-content" class="prompt-preview"></div>
    <div style="margin-top: 10px;">
        <button class="btn btn-primary" onclick="activatePrompt()">Activate</button>
        <button class="btn btn-danger" onclick="deletePrompt()">Delete</button>
    </div>
</div>

<div class="card">
    <h2>Create / Edit Prompt</h2>
    <div class="form-group">
        <label for="prompt-name">Name (kebab-case):</label>
        <input type="text" id="prompt-name" placeholder="ex: analyste-sigma">
    </div>
    <div class="form-group">
        <label for="prompt-content-input">Content:</label>
        <textarea id="prompt-content-input" rows="10" placeholder="Tu es un expert en règles Sigma..."></textarea>
    </div>
    <button class="btn btn-primary" onclick="savePrompt()">Save</button>
    <div id="save-status" class="status-message"></div>
</div>

<script>
let currentPrompts = [];
let activePromptName = '';

function loadPrompts() {
    Promise.all([
        fetch('/api/v1/admin/prompts/').then(r => r.json()).catch(() => []),
        fetch('/api/v1/admin/prompts/?action=active').then(r => r.json()).catch(() => ({}))
    ])
    .then(([prompts, activeData]) => {
        currentPrompts = prompts;
        
        // Update select
        const select = document.getElementById('prompt-select');
        select.innerHTML = '<option value="">Select a prompt...</option>';
        prompts.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.textContent = p.name;
            select.appendChild(opt);
        });
        
        // Active prompt
        activePromptName = activeData.name || activeData.prompt || '';
        let activeHtml = activePromptName 
            ? `<p><strong>Active:</strong> ${activePromptName}</p>`
            : '<p><em>No active prompt</em></p>';
        document.getElementById('active-prompt').innerHTML = activeHtml;
    })
    .catch(err => {
        document.getElementById('active-prompt').innerHTML = '<p class="error">Failed to load prompts</p>';
    });
}

function loadPromptContent() {
    const name = document.getElementById('prompt-select').value;
    if (!name) {
        document.getElementById('prompt-content').innerHTML = '';
        return;
    }
    
    fetch(`/api/v1/admin/prompts/?action=get&name=${encodeURIComponent(name)}`)
        .then(r => r.json())
        .then(data => {
            const content = data.content || '';
            document.getElementById('prompt-content').innerHTML = `<pre>${content}</pre>`;
        });
}

function activatePrompt() {
    const name = document.getElementById('prompt-select').value;
    if (!name) {
        alert('Select a prompt first');
        return;
    }
    
    fetch('/api/v1/admin/prompts/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'activate', name: name})
    })
    .then(r => r.json())
    .then(data => {
        alert(data.message || 'Activated');
        loadPrompts();
    });
}

function deletePrompt() {
    const name = document.getElementById('prompt-select').value;
    if (!name) {
        alert('Select a prompt first');
        return;
    }
    if (!confirm(`Delete prompt "${name}"?`)) return;
    
    fetch('/api/v1/admin/prompts/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'delete', name: name})
    })
    .then(r => r.json())
    .then(data => {
        alert(data.message || 'Deleted');
        loadPrompts();
    });
}

function savePrompt() {
    const name = document.getElementById('prompt-name').value.trim();
    const content = document.getElementById('prompt-content-input').value;
    
    if (!name) {
        document.getElementById('save-status').textContent = 'Name is required';
        document.getElementById('save-status').className = 'status-message error';
        return;
    }
    if (!content) {
        document.getElementById('save-status').textContent = 'Content is required';
        document.getElementById('save-status').className = 'status-message error';
        return;
    }
    
    fetch('/api/v1/admin/prompts/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: name, content: content})
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById('save-status').textContent = data.message || 'Saved';
        document.getElementById('save-status').className = data.error ? 'status-message error' : 'status-message success';
        loadPrompts();
    })
    .catch(err => {
        document.getElementById('save-status').textContent = 'Error: ' + err;
        document.getElementById('save-status').className = 'status-message error';
    });
}

document.addEventListener('DOMContentLoaded', function() {
    loadPrompts();
});
</script>

<style>
.form-group {
    margin-bottom: 15px;
}
.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}
.form-group input, .form-group textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
}
.form-group textarea {
    font-family: monospace;
}
.prompt-preview {
    margin: 15px 0;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 4px;
    max-height: 300px;
    overflow: auto;
}
.prompt-preview pre {
    white-space: pre-wrap;
    margin: 0;
}
.status-message {
    margin-top: 10px;
    padding: 10px;
    border-radius: 4px;
}
.status-message.success {
    background: #d4edda;
    color: #155724;
}
.status-message.error {
    background: #f8d7da;
    color: #721c24;
}
</style>
{% endblock %}
