{% extends "admin/base.html" %}

{% block title %}Qdrant | Admin | SigmaHQ RAG{% endblock %}

{% block header %}Qdrant Management{% endblock %}

{% block content %}
<div class="card">
    <h2>Configuration</h2>
    <form id="config-form">
        <div class="form-group">
            <label for="host-input">Host:</label>
            <input type="text" id="host-input" value="localhost" readonly>
        </div>
        <div class="form-group">
            <label for="port-input">Port:</label>
            <input type="text" id="port-input" value="6333" readonly>
        </div>
    </form>
</div>

<div class="card">
    <h2>Version <button class="btn btn-secondary" onclick="loadQdrantInfo()" style="float:right;">Refresh</button></h2>
    <div id="qdrant-info">
        <p>Loading...</p>
    </div>
    <div style="margin-top: 15px;">
        <button id="qdrant-download-btn" class="btn btn-primary" onclick="downloadQdrant()">Download / Update</button>
        <button id="qdrant-start-btn" class="btn btn-success" onclick="startQdrant()">Start</button>
        <button id="qdrant-stop-btn" class="btn btn-danger" onclick="stopQdrant()">Stop</button>
    </div>
    <div id="download-status" class="status-message"></div>
</div>

<script>
function loadQdrantInfo() {
    Promise.all([
        fetch('/api/v1/qdrant/status').then(r => r.json()).catch(() => ({}))
    ])
    .then(([v1Status]) => {
        const version = v1Status.current_version || 'unknown';
        let html = '<p><strong>Status:</strong> ' + (v1Status.status || 'unknown') + '</p>';
        html += '<p><strong>Version:</strong> ' + version + '</p>';
        html += '<p><strong>Port:</strong> ' + (v1Status.port || '6333') + '</p>';
        html += '<p><strong>URL:</strong> ' + (v1Status.url || 'http://localhost:6333') + '</p>';
        if (v1Status.message) {
            html += '<p><strong>Message:</strong> ' + v1Status.message + '</p>';
        }
        if (v1Status.mode) {
            html += '<p><strong>Mode:</strong> ' + v1Status.mode + '</p>';
        }
        document.getElementById('qdrant-info').innerHTML = html;

        const isExternal = v1Status.mode === 'external';
        document.getElementById('qdrant-start-btn').disabled = isExternal;
        document.getElementById('qdrant-stop-btn').disabled = isExternal;
        document.getElementById('qdrant-download-btn').disabled = isExternal;
    })
    .catch(err => {
        document.getElementById('qdrant-info').innerHTML = '<p class="error">Failed to load info: ' + err + '</p>';
    });
}

function downloadQdrant() {
    document.getElementById('download-status').textContent = 'Starting download...';
    document.getElementById('download-status').className = 'status-message';

    fetch('/api/v1/qdrant/download', {
        method: 'POST'
    })
    .then(r => r.json())
    .then(data => {
        if (data.download_id) {
            document.getElementById('download-status').textContent = 'Download started: ' + data.download_id;
            document.getElementById('download-status').className = 'status-message success';
            loadQdrantInfo();
        } else if (data.message) {
            document.getElementById('download-status').textContent = data.message;
            document.getElementById('download-status').className = 'status-message success';
        } else {
            document.getElementById('download-status').textContent = data.error || 'Download failed';
            document.getElementById('download-status').className = 'status-message error';
        }
    })
    .catch(err => {
        document.getElementById('download-status').textContent = 'Error: ' + err;
        document.getElementById('download-status').className = 'status-message error';
    });
}

function startQdrant() {
    fetch('/api/v1/qdrant/start', {
        method: 'POST'
    })
    .then(r => r.json())
    .then(data => {
        alert(data.message || data.error || 'Started');
        loadQdrantInfo();
    })
    .catch(err => alert('Error: ' + err));
}

function stopQdrant() {
    fetch('/api/v1/qdrant/stop', {
        method: 'POST'
    })
    .then(r => r.json())
    .then(data => {
        alert(data.message || data.error || 'Stopped');
        loadQdrantInfo();
    })
    .catch(err => alert('Error: ' + err));
}

document.addEventListener('DOMContentLoaded', function() {
    loadQdrantInfo();
});
</script>

<style>
.form-group {
    margin-bottom: 15px;
}
.form-group label {
    display: inline-block;
    width: 120px;
    font-weight: bold;
}
.form-group input {
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    min-width: 150px;
}
.status-message {
    margin-top: 15px;
    padding: 10px;
    border-radius: 4px;
}
.status-message.success {
    background: #d4edda;
    color: #155724;
}
.status-message.error {
    background: #f8d7da;
    color: #721c24;
}
</style>
{% endblock %}
