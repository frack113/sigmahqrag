{% extends "admin/base.html" %}

{% block title %}System Prompts | Admin | SigmaHQ RAG{% endblock %}

{% block header %}System Prompts{% endblock %}

{% block content %}
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span class="h5 mb-0">Prompts List</span>
        <div>
            <button class="btn btn-sm btn-success" onclick="syncFromFiles()">Sync from files</button>
            <button class="btn btn-sm btn-primary" onclick="EnableEditForm()">Add new</button>
            <button class="btn btn-sm btn-secondary" onclick="refreshList()">Refresh list</button>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="prompts-table-body">
            </tbody>
        </table>
    </div>
</div>

<div class="card" id="prompt-form-container">
    <h2 class="card-header" id="edit-form-title">Edit Prompt</h2>
    <div class="card-body">
        <div class="form-group mb-3">
            <label for="prompt-id" class="form-label">ID:</label>
            <input type="text" id="prompt-id" class="form-control" placeholder="UUID will be generated" readonly>
        </div>
        <div class="form-group mb-3">
            <label for="prompt-name" class="form-label">Name (kebab-case, max 25):</label>
            <input type="text" id="prompt-name" class="form-control" placeholder="ex: analyste-sigma" maxlength="25" disabled>
        </div>
        <div class="form-group mb-3">
            <label for="prompt-description" class="form-label">Description (max 100):</label>
            <input type="text" id="prompt-description" class="form-control" placeholder="Brief description..." maxlength="100" disabled>
        </div>
        <div class="form-group mb-3">
            <label for="prompt-content-input" class="form-label">Content (Markdown):</label>
            <textarea id="prompt-content-input" class="form-control" rows="10" cols="120" placeholder="Enter prompt content..." disabled></textarea>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-secondary" id="btn-cancel" onclick="resetForm()" disabled>Cancel</button>
            <button class="btn btn-primary" id="btn-save" onclick="savePrompt()" disabled>Save Prompt</button>
        </div>
        <div id="save-status" class="mt-3 status-message" role="status" aria-live="polite"></div>
    </div>
</div>

<script>
let currentPrompts = [];

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

async function loadPrompts() {
    try {
        const res = await fetch('/api/v1/admin/prompts');
        if (!res.ok) throw new Error('Failed to load prompts');
        const promptsRes = await res.json();
        
        currentPrompts = promptsRes;

        const tbody = document.getElementById('prompts-table-body');
        tbody.innerHTML = '';
        
        if (promptsRes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No prompts found</td></tr>';
        } else {
            promptsRes.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(p.name)}</strong></td>
                    <td class="text-muted">${escapeHtml(p.description || '')}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-primary" onclick="editPrompt('${escapeHtml(p.id)}')">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deletePrompt('${escapeHtml(p.id)}', '${escapeHtml(p.name)}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    } catch (err) {
        console.error('Error loading prompts:', err);
        showStatus('Failed to load prompts', 'error');
    }
}

async function syncFromFiles() {
    showStatus('Syncing prompts from files...', 'info');
    try {
        const res = await fetch('/api/v1/admin/prompts/sync', { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
            showStatus(data.message || 'Sync complete', 'success');
            await loadPrompts();
        } else {
            showStatus(data.error || 'Sync failed', 'error');
        }
    } catch (err) {
        showStatus('Network error: ' + err.message, 'error');
    }
}

async function refreshList() {
    showStatus('Refreshing...', 'info');
    await loadPrompts();
    showStatus('', '');
}

function toggleFormInputs(disabled) {
    const fields = ['prompt-name', 'prompt-description', 'prompt-content-input'];
    fields.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = disabled;
    });
    document.getElementById('btn-cancel').disabled = !disabled;
    document.getElementById('btn-save').disabled = !disabled;
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

function resetForm() {
    const fields = ['prompt-id', 'prompt-name', 'prompt-description', 'prompt-content-input'];
    fields.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });
    
    document.getElementById('edit-form-title').textContent = 'Create New Prompt';
    document.getElementById('save-status').textContent = '';
    document.getElementById('save-status').className = 'mt-3 status-message';
    toggleFormInputs(true);
}

function EnableEditForm() {
    resetForm();
    const newId = generateUUID();
    document.getElementById('prompt-id').value = newId;
    document.getElementById('prompt-name').disabled = false;
    document.getElementById('prompt-description').disabled = false;
    document.getElementById('prompt-content-input').disabled = false;
    document.getElementById('btn-cancel').disabled = false;
    document.getElementById('btn-save').disabled = false;
    document.getElementById('edit-form-title').textContent = 'Create New Prompt';
}

async function editPrompt(id) {
    try {
        const res = await fetch(`/api/v1/admin/prompts/${encodeURIComponent(id)}`);
        const data = await res.json();
        
        if (!res.ok || data.error) throw new Error(data.error || 'Failed to load prompt');

        document.getElementById('prompt-id').value = data.id;
        document.getElementById('prompt-name').value = data.name;
        document.getElementById('prompt-description').value = data.description || '';
        document.getElementById('prompt-content-input').value = data.content || '';
        document.getElementById('edit-form-title').textContent = 'Edit Prompt';
        document.getElementById('save-status').textContent = '';
        document.getElementById('save-status').className = 'mt-3 status-message';
        toggleFormInputs(false);
    } catch (err) {
        console.error('Error loading prompt:', err);
        showStatus('Error: ' + err.message, 'error');
    }
}

async function savePrompt() {
    const id = document.getElementById('prompt-id').value;
    const valName = document.getElementById('prompt-name').value.trim();
    const valDesc = document.getElementById('prompt-description').value.trim();
    const valContent = document.getElementById('prompt-content-input').value;

    if (!valName) {
        showStatus('Name is required', 'error');
        return;
    }

    if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(valName)) {
        showStatus('Name must be in kebab-case (e.g., my-prompt)', 'error');
        return;
    }

    const isNewPrompt = !currentPrompts.some(p => p.id === id);
    const url = isNewPrompt ? '/api/v1/admin/prompts' : `/api/v1/admin/prompts/${id}`;
    const method = isNewPrompt ? 'POST' : 'PUT';
    const body = JSON.stringify({ name: valName, description: valDesc, content: valContent });

    const saveBtn = document.getElementById('btn-save');
    saveBtn.disabled = true;

    try {
        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: body
        });
        const data = await res.json();

        if (res.ok) {
            showStatus(data.message || 'Saved!', 'success');
            resetForm();
            await loadPrompts();
        } else {
            showStatus(data.error || 'Error saving prompt', 'error');
        }
    } catch (err) {
        console.error('Error saving prompt:', err);
        showStatus('Network error: ' + err.message, 'error');
    } finally {
        saveBtn.disabled = false;
    }
}

async function deletePrompt(id, name) {
    if (!confirm(`Delete prompt "${name}"?\n\nThis action cannot be undone.`)) return;
    try {
        const res = await fetch(`/api/v1/admin/prompts/${encodeURIComponent(id)}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok) {
            showStatus('Prompt deleted', 'success');
            await loadPrompts();
        } else {
            showStatus('Error deleting prompt', 'error');
        }
    } catch (err) {
        console.error('Error deleting prompt:', err);
        showStatus('Network error: ' + err.message, 'error');
    }
}

function showStatus(msg, type) {
    const el = document.getElementById('save-status');
    el.textContent = msg;
    if (type === 'error') el.className = 'mt-3 status-message text-danger';
    else if (type === 'success') el.className = 'mt-3 status-message text-success';
    else if (type === 'info') el.className = 'mt-3 status-message text-info';
    else el.className = 'mt-3 status-message';
}

document.addEventListener('DOMContentLoaded', loadPrompts);
</script>

{% endblock %}
