{% extends "admin/base.html" %}

{% block title %}Dashboard | Admin | SigmaHQ RAG{% endblock %}

{% block header %}System Dashboard{% endblock %}

{% block content %}
<div class="card">
    <h2>System Status <button class="btn btn-primary" onclick="refreshStatus()" style="float:right;">Refresh</button></h2>
    <div id="status-cards">
        <p>Loading status...</p>
    </div>
</div>

<div class="card">
    <h2>Hardware Information</h2>
    <div id="hardware-info">
        <p>Loading hardware info...</p>
    </div>
</div>

<div class="card">
    <h2>Installed Models</h2>
    <div id="models-list">
        <p>Loading models...</p>
    </div>
</div>

<script>
let pollInterval;

function loadStatus() {
    fetch('/api/v1/admin/status')
        .then(r => r.json())
        .then(data => {
            const llm = data.llm || {};
            const qdrant = data.qdrant || {};
            const html = `
                <div class="status-item">
                    <span class="status-dot status-${llm.status}"></span>
                    <strong>LLM:</strong> ${llm.status}
                    ${llm.response_time ? `( ${llm.response_time}s)` : ''}
                    ${llm.error ? `<br><small>${llm.error}</small>` : ''}
                </div>
                <div class="status-item">
                    <span class="status-dot status-${qdrant.status}"></span>
                    <strong>Qdrant:</strong> ${qdrant.status}
                    ${qdrant.response_time ? `( ${qdrant.response_time}s)` : ''}
                    ${qdrant.error ? `<br><small>${qdrant.error}</small>` : ''}
                </div>
            `;
            document.getElementById('status-cards').innerHTML = html;
        });
}

function loadHardware() {
    fetch('/api/v1/admin/hardware')
        .then(r => r.json())
        .then(data => {
            const hw = data.hardware || {};
            const html = `
                <p><strong>CPU:</strong> ${hw.cpu || 'Unknown'}</p>
                <p><strong>RAM:</strong> ${hw.memory || 'Unknown'}</p>
                <p><strong>GPU:</strong> ${hw.gpu_detected ? hw.gpu_type : 'Not detected'}</p>
            `;
            document.getElementById('hardware-info').innerHTML = html;
        });
}

function loadModels() {
    fetch('/api/v1/admin/models')
        .then(r => r.json())
        .then(data => {
            if (data.models && data.models.length > 0) {
                let html = '<table><tr><th>Model</th><th>Size</th><th>Action</th></tr>';
                data.models.forEach(m => {
                    html += `<tr>
                        <td>${m.repo_id}/${m.filename}</td>
                        <td>${Math.round(m.size_mb)}MB</td>
                        <td><button class="btn btn-danger" onclick="deleteModel('${m.repo_id}', '${m.filename}')">Delete</button></td>
                    </tr>`;
                });
                html += '</table>';
                document.getElementById('models-list').innerHTML = html;
            } else {
                document.getElementById('models-list').innerHTML = '<p>No models installed.</p>';
            }
        });
}

function refreshStatus() {
    loadStatus();
    loadHardware();
}

function deleteModel(repoId, filename) {
    if (!confirm('Delete this model?')) return;

    fetch('/api/v1/admin/models/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({repo_id: repoId, filename: filename})
    })
    .then(r => r.json())
    .then(data => {
        alert(data.message || 'Deleted successfully');
        loadModels();
    });
}

document.addEventListener('DOMContentLoaded', function() {
    loadStatus();
    loadHardware();
    loadModels();

    // Poll every 30 seconds
    pollInterval = setInterval(() => {
        loadStatus();
    }, 30000);
});
</script>

<style>
.status-item {
    margin-bottom: 15px;
    padding: 10px;
    background: #f8f9fa;
    border-radius: 4px;
}
.status-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 8px;
}
.status-dot.status-ok {
    background: #27ae60;
}
.status-dot.status-warning {
    background: #f39c12;
}
.status-dot.status-error {
    background: #e74c3c;
}
</style>
{% endblock %}
