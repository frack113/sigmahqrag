{% extends "admin/base.html" %}

{% block title %}Dashboard | Admin | SigmaHQ RAG{% endblock %}

{% block header %}System Dashboard{% endblock %}

{% block content %}
<div id="update-banner"></div>

<div class="card">
    <h2>System Status <button class="btn btn-primary" onclick="refreshStatus()" style="float:right;">Refresh</button></h2>
    <div id="status-cards">
        <p>Loading status...</p>
    </div>
</div>

<script>
let pollInterval;

function loadStatus() {
    Promise.all([
        fetch('/admin/health').then(r => r.json()),
        fetch('/admin/llama/info').then(r => r.json()).catch(() => ({})),
        fetch('/api/v1/admin/status').then(r => r.json()).catch(() => ({}))
    ])
    .then(([healthData, llamaInfo, v1Status]) => {
        const services = healthData.services || [];
        const llama = services.find(s => s.name === 'llama.cpp') || {};
        const qdrant = services.find(s => s.name === 'qdrant') || {};
        
        // Determine status class
        const getStatusClass = (status) => {
            if (status === 'running') return 'ok';
            if (status === 'stopped') return 'error';
            return 'warning';
        };
        
        const html = `
            <div class="service-row">
                <div class="service-name">llama.cpp</div>
                <div class="service-status">
                    <span class="status-dot status-${getStatusClass(llama.status)}"></span>
                    <span class="status-text">${llama.status || 'unknown'}</span>
                    ${llamaInfo.current_version ? `<span class="version">v${llamaInfo.current_version}</span>` : ''}
                </div>
                <div class="service-actions">
                    <button class="btn btn-sm btn-success" onclick="startService('llama')">Start</button>
                    <button class="btn btn-sm btn-danger" onclick="stopService('llama')">Stop</button>
                    <button class="btn btn-sm" onclick="showLogs('llama')">Logs</button>
                </div>
            </div>
            <div class="service-row">
                <div class="service-name">Qdrant</div>
                <div class="service-status">
                    <span class="status-dot status-${getStatusClass(qdrant.status)}"></span>
                    <span class="status-text">${qdrant.status || 'unknown'}</span>
                    ${qdrant.version ? `<span class="version">v${qdrant.version}</span>` : ''}
                </div>
                <div class="service-actions">
                    <button class="btn btn-sm btn-success" onclick="startService('qdrant')">Start</button>
                    <button class="btn btn-sm btn-danger" onclick="stopService('qdrant')">Stop</button>
                    <button class="btn btn-sm" onclick="showLogs('qdrant')">Logs</button>
                </div>
            </div>
        `;
        document.getElementById('status-cards').innerHTML = html;
        
        // Update banner
        let bannerHtml = '';
        if (llamaInfo.update_available) {
            bannerHtml += `<div class="update-alert">Update available for llama.cpp: v${llamaInfo.latest_version}</div>`;
        }
        document.getElementById('update-banner').innerHTML = bannerHtml;
    })
    .catch(err => {
        document.getElementById('status-cards').innerHTML = '<p class="error">Failed to load status</p>';
    });
}

function startService(service) {
    fetch(`/admin/services/?action=start&service=${service}`, {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            alert(data.message || data.error || 'Started');
            loadStatus();
        });
}

function stopService(service) {
    if (!confirm(`Stop ${service}?`)) return;
    fetch(`/admin/services/?action=stop&service=${service}`, {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            alert(data.message || data.error || 'Stopped');
            loadStatus();
        });
}

function showLogs(service) {
    fetch(`/admin/services/?action=logs&service=${service}`)
        .then(r => r.json())
        .then(data => {
            const logs = data.logs || 'No logs available';
            alert(logs.slice(-2000)); // Last 2000 chars
        });
}


function loadModels() {
    fetch('/api/v1/admin/models')
        .then(r => r.json())
        .then(data => {
            if (data.models && data.models.length > 0) {
                let html = '<table><tr><th>Model</th><th>Size</th><th>Action</th></tr>';
                data.models.forEach(m => {
                    html += `<tr>
                        <td>${m.repo_id}/${m.filename}</td>
                        <td>${Math.round(m.size_mb)}MB</td>
                        <td><button class="btn btn-danger" onclick="deleteModel('${m.repo_id}', '${m.filename}')">Delete</button></td>
                    </tr>`;
                });
                html += '</table>';
                document.getElementById('models-list').innerHTML = html;
            } else {
                document.getElementById('models-list').innerHTML = '<p>No models installed.</p>';
            }
        });
}

function refreshStatus() {
    loadStatus();
}

function deleteModel(repoId, filename) {
    if (!confirm('Delete this model?')) return;

    fetch('/api/v1/admin/models/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({repo_id: repoId, filename: filename})
    })
    .then(r => r.json())
    .then(data => {
        alert(data.message || 'Deleted successfully');
        loadModels();
    });
}

document.addEventListener('DOMContentLoaded', function() {
    loadStatus();
    loadModels();

    // Poll every 30 seconds
    pollInterval = setInterval(() => {
        loadStatus();
    }, 30000);
});
</script>

<style>
.status-item {
    margin-bottom: 15px;
    padding: 10px;
    background: #f8f9fa;
    border-radius: 4px;
}
.status-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 8px;
}
.status-dot.status-ok {
    background: #27ae60;
}
.status-dot.status-warning {
    background: #f39c12;
}
.status-dot.status-error {
    background: #e74c3c;
}
</style>
{% endblock %}
