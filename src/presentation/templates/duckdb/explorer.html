{% extends "duckdb/base.html" %}

{% block content %}
<div id="duckdb-content">
    <div class="welcome-message">
        <h2>DuckDB Explorer</h2>
        <p>Select a table from the sidebar to view its contents. All data is read-only.</p>
        <p class="tables-summary">Loading tables...</p>
        <div class="auto-refresh-bar">
            <button id="auto-refresh-btn" class="btn btn-sm" onclick="toggleAutoRefresh()">
                Auto-refresh: ON (5s)
            </button>
        </div>
    </div>
</div>
{% endblock %}
