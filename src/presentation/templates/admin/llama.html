{% extends "admin/base.html" %}

{% block title %}llama.cpp | Admin | SigmaHQ RAG{% endblock %}

{% block header %}llama.cpp Management{% endblock %}

{% block content %}
<div class="card">
    <h2>Configuration</h2>
    <form id="config-form">
        <div class="form-group">
            <label for="os-select">OS:</label>
            <select id="os-select" name="os">
                    <option value="windows" {% if config.Hardware.os == 'windows' %}selected{% endif %}>Windows</option>
                    <option value="linux" {% if config.Hardware.os == 'linux' %}selected{% endif %}>Linux</option>
                    <option value="macos" {% if config.Hardware.os == 'macos' %}selected{% endif %}>macOS</option>
            </select>
        </div>
        <div class="form-group">
            <label for="gpu-select">GPU Backend:</label>
            <select id="gpu-select" name="gpu">
                    <option value="cpu" {% if config.Hardware.gpu == 'cpu' %}selected{% endif %}>CPU</option>
                    <option value="cuda" {% if config.Hardware.gpu == 'cuda' %}selected{% endif %}>CUDA</option>
                    <option value="hip" {% if config.Hardware.gpu == 'hip' %}selected{% endif %}>HIP (AMD)</option>
                    <option value="vulkan" {% if config.Hardware.gpu == 'vulkan' %}selected{% endif %}>Vulkan</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save Configuration</button>
    </form>
    <div id="config-status" class="status-message"></div>
</div>

<div class="card">
    <h2>Version <button class="btn btn-secondary" onclick="loadLlamaInfo()" style="float:right;">Refresh</button></h2>
    <div id="llama-info">
        <p>Loading...</p>
    </div>
    <div style="margin-top: 15px;">
        <button id="llama-download-btn" class="btn btn-primary" onclick="downloadLlama()">Download / Update</button>
        <button id="llama-start-btn" class="btn btn-success" onclick="startLlama()">Start</button>
        <button id="llama-stop-btn" class="btn btn-danger" onclick="stopLlama()">Stop</button>
    </div>
    <div id="download-status" class="status-message"></div>
    <div id="progress-container" style="display:none;">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <p id="progress-text">Downloading...</p>
    </div>
</div>

<script id="config-data" type="application/json">{{ config_json | safe }}</script>
<script src="{{ url_for('static', path='/js/progress-bar.js') }}"></script>
<script>

// Load config from embedded JSON (synchronous, no visual lag)
var _CONFIG = {};
try { _CONFIG = JSON.parse(document.getElementById('config-data').textContent); } catch(e) {}

function applyConfig(cfg) {
    const hw = (cfg && cfg.Hardware) || {};
    document.getElementById('os-select').value = hw.os || 'windows';
    document.getElementById('gpu-select').value = hw.gpu || 'cpu';
}

function loadLlamaInfo() {
    fetch('/api/v1/llamacpp/status')
        .then(r => r.json())
        .then(data => {
            let html = '<p><strong>Current Version:</strong> ' + (data.current_version || 'Not installed') + '</p>';
            if (data.downloads && Object.keys(data.downloads).length > 0) {
                html += '<p class="warning">Download in progress</p>';
            }
            document.getElementById('llama-info').innerHTML = html;

            const isExternal = data.mode === 'external';
            document.getElementById('llama-start-btn').disabled = isExternal;
            document.getElementById('llama-stop-btn').disabled = isExternal;
            document.getElementById('llama-download-btn').disabled = isExternal;
        })
        .catch(err => {
            document.getElementById('llama-info').innerHTML = '<p class="error">Failed to load info: ' + err + '</p>';
        });
}

function saveConfig() {
    const statusEl = document.getElementById('config-status');
    statusEl.textContent = 'Saving...';
    statusEl.className = 'status-message';

    const os = document.getElementById('os-select').value;
    const gpu = document.getElementById('gpu-select').value;

    fetch('/api/v1/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({Hardware: {os: os, gpu: gpu}})
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'success') {
            statusEl.textContent = data.message || 'Configuration saved';
            statusEl.className = 'status-message success';
        } else {
            statusEl.textContent = data.error || 'Save failed';
            statusEl.className = 'status-message error';
        }
    })
    .catch(err => {
        statusEl.textContent = 'Error: ' + err;
        statusEl.className = 'status-message error';
    });
}

document.getElementById('config-form').addEventListener('submit', function(e) {
    e.preventDefault();
    saveConfig();
});

function downloadLlama() {
    var btn = document.getElementById('llama-download-btn');
    if (btn && btn.disabled) return;
    if (btn) btn.disabled = true;
    var pb = new ProgressBar({
        container: document.getElementById('progress-container'),
        fill: document.getElementById('progress-fill'),
        text: document.getElementById('progress-text'),
    });
    var statusEl = document.getElementById('download-status');
    statusEl.textContent = 'Starting download...';
    statusEl.className = 'status-message';
    pb.show();

    fetch('/api/v1/llamacpp/download', {
        method: 'POST'
    })
    .then(r => r.json())
    .then(data => {
        if (data.download_id) {
            statusEl.textContent = data.message || 'Download started: ' + data.download_id;
            statusEl.className = 'status-message success';
            ProgressBar.pollDownload({
                endpoint: '/api/v1/llamacpp/status',
                downloadId: data.download_id,
                onUpdate: function(pct, text) { pb.setProgress(pct); pb.setText(text); statusEl.textContent = 'Downloading... ' + text; },
                onComplete: function() { pb.hide(); statusEl.textContent = 'Download completed!'; statusEl.className = 'status-message success'; if (btn) btn.disabled = false; loadLlamaInfo(); },
                onError: function(msg) { pb.hide(); statusEl.textContent = 'Download failed: ' + msg; statusEl.className = 'status-message error'; if (btn) btn.disabled = false; }
            });
        } else if (data.message) {
            statusEl.textContent = data.message;
            statusEl.className = 'status-message success';
            pb.hide();
            if (btn) btn.disabled = false;
        } else {
            statusEl.textContent = data.error || 'Download failed';
            statusEl.className = 'status-message error';
            pb.hide();
            if (btn) btn.disabled = false;
        }
    })
    .catch(err => {
        statusEl.textContent = 'Error: ' + err;
        statusEl.className = 'status-message error';
        pb.hide();
        if (btn) btn.disabled = false;
    });
}

function updateLlama() {
    document.getElementById('download-status').textContent = 'Updating...';
    document.getElementById('download-status').className = 'status-message';

    fetch('/admin/llama/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({})
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            document.getElementById('download-status').textContent = 'Updated to v' + data.version;
            document.getElementById('download-status').className = 'status-message success';
            loadLlamaInfo();
        } else {
            document.getElementById('download-status').textContent = data.error || 'Update failed';
            document.getElementById('download-status').className = 'status-message error';
        }
    })
    .catch(err => {
        document.getElementById('download-status').textContent = 'Error: ' + err;
        document.getElementById('download-status').className = 'status-message error';
    });
}

function startLlama() {
    fetch('/api/v1/llamacpp/start', {
        method: 'POST'
    })
    .then(r => r.json())
    .then(data => {
        alert(data.message || data.error || 'Started');
        loadLlamaInfo();
    })
    .catch(err => alert('Error: ' + err));
}

function stopLlama() {
    fetch('/api/v1/llamacpp/stop', {
        method: 'POST'
    })
    .then(r => r.json())
    .then(data => {
        alert(data.message || data.error || 'Stopped');
        loadLlamaInfo();
    })
    .catch(err => alert('Error: ' + err));
}

document.addEventListener('DOMContentLoaded', function() {
    applyConfig(_CONFIG);
    loadLlamaInfo();
});
</script>

{% endblock %}
