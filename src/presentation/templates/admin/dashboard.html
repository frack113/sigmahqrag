{% extends "admin/base.html" %}

{% block title %}Dashboard | Admin | SigmaHQ RAG{% endblock %}

{% block header %}System Dashboard{% endblock %}

{% block content %}
<div id="update-banner"></div>

<div class="card">
    <div class="card-header">
        <h2>System Status</h2>
        <button class="btn btn-primary btn-sm" onclick="refreshStatus()">Refresh</button>
    </div>
    <div class="card-body">
        <div id="status-cards">
            <p>Loading status...</p>
        </div>
    </div>
</div>

<script>
let pollInterval;

function loadStatus() {
    Promise.all([
        fetch('/api/v1/llamacpp/status').then(r => r.json()).catch(() => ({})),
        fetch('/api/v1/qdrant/status').then(r => r.json()).catch(() => ({}))
    ])
    .then(([llamaInfo, qdrantInfo]) => {
        const llama = {status: llamaInfo.status || 'unknown', name: 'llama.cpp'};
        const qdrant = {status: qdrantInfo.status || 'unknown', name: 'qdrant'};
        
        // Determine status class
        const getStatusClass = (status) => {
            if (status === 'running') return 'ok';
            if (status === 'stopped') return 'error';
            return 'warning';
        };
        
        const html = `
            <div class="service-row">
                <div class="service-name">llama.cpp</div>
                <div class="service-status">
                    <span class="status-dot status-${getStatusClass(llama.status)}"></span>
                    <span class="status-text">${llama.status || 'unknown'}</span>
                    ${llamaInfo.current_version ? `<span class="version">v${llamaInfo.current_version}</span>` : ''}
                </div>
                <div class="service-actions" id="llama-actions">
                    <button class="btn btn-sm btn-success" onclick="startService('llama')">Start</button>
                    <button class="btn btn-sm btn-danger" onclick="stopService('llama')">Stop</button>
                    <button class="btn btn-sm" onclick="showLogs('llama')">Logs</button>
                </div>
            </div>
            <div class="service-row">
                <div class="service-name">Qdrant</div>
                <div class="service-status">
                    <span class="status-dot status-${getStatusClass(qdrant.status)}"></span>
                    <span class="status-text">${qdrant.status || 'unknown'}</span>
                    ${qdrantInfo.current_version ? `<span class="version">v${qdrantInfo.current_version}</span>` : ''}
                </div>
                <div class="service-actions" id="qdrant-actions">
                    <button class="btn btn-sm btn-success" onclick="startService('qdrant')">Start</button>
                    <button class="btn btn-sm btn-danger" onclick="stopService('qdrant')">Stop</button>
                    <button class="btn btn-sm" onclick="showLogs('qdrant')">Logs</button>
                </div>
            </div>
        `;
        document.getElementById('status-cards').innerHTML = html;
        
        // Disable Qdrant management buttons in external mode
        const isQdrantExternal = qdrantInfo.mode === 'external';
        if (isQdrantExternal) {
            const qdrantActions = document.getElementById('qdrant-actions');
            if (qdrantActions) {
                qdrantActions.querySelectorAll('button').forEach(b => b.disabled = true);
            }
        }

        // Disable llama.cpp management buttons in external mode
        const isLlamaExternal = llamaInfo.mode === 'external';
        if (isLlamaExternal) {
            const llamaActions = document.getElementById('llama-actions');
            if (llamaActions) {
                llamaActions.querySelectorAll('button').forEach(b => b.disabled = true);
            }
        }

        // Update banner
        let bannerHtml = '';
        if (llamaInfo.update_available) {
            bannerHtml += `<div class="update-alert">Update available for llama.cpp: v${llamaInfo.latest_version}</div>`;
        }
        document.getElementById('update-banner').innerHTML = bannerHtml;
    })
    .catch(err => {
        document.getElementById('status-cards').innerHTML = '<p class="error">Failed to load status</p>';
    });
}

function startService(service) {
    const endpoint = service === 'llama' ? '/api/v1/llamacpp/start' : '/api/v1/qdrant/start';
    fetch(endpoint, {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            alert(data.message || data.error || 'Started');
            loadStatus();
        });
}

function stopService(service) {
    if (!confirm(`Stop ${service}?`)) return;
    const endpoint = service === 'llama' ? '/api/v1/llamacpp/stop' : '/api/v1/qdrant/stop';
    fetch(endpoint, {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            alert(data.message || data.error || 'Stopped');
            loadStatus();
        });
}

function showLogs(service) {
    const source = service === 'llama' ? 'llamacpp' : 'qdrant';
    fetch(`/api/v1/logs?source=${source}&lines=50`)
        .then(r => r.json())
        .then(data => {
            const logs = data.logs?.map(l => l.text).join('\n') || 'No logs available';
            alert(logs.slice(-2000)); // Last 2000 chars
        });
}


function escHtml(s) {
    if (s == null) return '';
    return String(s)
        .replace(/&/g, '&' + 'amp;')
        .replace(/</g, '&' + 'lt;')
        .replace(/>/g, '&' + 'gt;')
        .replace(/"/g, '&' + 'quot;')
        .replace(/'/g, '&' + '#39;');
}

function escAttr(s) {
    if (s == null) return '';
    return String(s)
        .replace(/&/g, '&' + 'amp;')
        .replace(/"/g, '&' + 'quot;')
        .replace(/'/g, '&' + '#39;')
        .replace(/</g, '&' + 'lt;')
        .replace(/>/g, '&' + 'gt;');
}

function loadModels() {
    fetch('/api/v1/models/llm/installed')
        .then(r => r.json())
        .then(data => {
            const models = data.models || [];
            if (models.length > 0) {
                let html = '<table><tr><th>Model</th><th>Size</th><th>Action</th></tr>';
                models.forEach(m => {
                    for (const [filename, f] of Object.entries(m.files)) {
                        const safeRepoId = escAttr(m.repo_id);
                        const safeFilename = escAttr(filename);
                        html += `<tr>
                            <td>${escHtml(m.repo_id)}/${escHtml(filename)}</td>
                            <td class="num">${Math.round(f.size / 1024 / 1024)}MB</td>
                            <td><button class="btn btn-danger" onclick="deleteModel('${safeRepoId}', '${safeFilename}')">Delete</button></td>
                        </tr>`;
                    }
                });
                html += '</table>';
                document.getElementById('models-list').innerHTML = html;
            } else {
                document.getElementById('models-list').innerHTML = '<p>No models installed.</p>';
            }
        });
}

function refreshStatus() {
    loadStatus();
}

function deleteModel(repoId, filename) {
    if (!confirm('Delete this model?')) return;

    fetch(`/api/v1/models/llm/${encodeURIComponent(repoId)}/file/${encodeURIComponent(filename)}`, {
        method: 'DELETE'
    })
    .then(r => r.json())
    .then(data => {
        alert(data.success ? 'Deleted successfully' : data.error);
        loadModels();
    })
    .catch(err => {
        alert('Delete failed: ' + err);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    loadStatus();
    loadModels();

    // Poll every 30 seconds
    pollInterval = setInterval(() => {
        loadStatus();
    }, 30000);
});
</script>

{% endblock %}
