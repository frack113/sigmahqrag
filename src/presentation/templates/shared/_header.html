{# Global header #}
<header class="app-header">
    <div class="app-header-left">
        <h1>Sigmahqrag</h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="/chat" {% if request.url.path == '/chat' or request.url.path == '/' %}class="active"{% endif %}>Chat</a></li>
                <li><a href="/data" {% if '/data' in request.url.path %}class="active"{% endif %}>Data</a></li>
                <li><a href="/duckdb" {% if '/duckdb' in request.url.path %}class="active"{% endif %}>DuckDB</a></li>
                <li><a href="/config" {% if '/config/' in request.url.path %}class="active"{% endif %}>Config</a></li>
                <li><a href="/logs" {% if '/logs' in request.url.path %}class="active"{% endif %}>Logs</a></li>
            </ul>
        </nav>
    </div>
    <div class="app-header-right">
        <label class="theme-toggle" title="Toggle light/dark theme">
            <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
            <span class="theme-slider"></span>
           <span class="theme-label" id="theme-emoji-label">🌙</span>
        </label>
    </div>
</header>

<style>
.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 2px solid #3498db;
    background: #2c3e50;
    gap: 16px;
}

.app-header-left {
    display: flex;
    align-items: center;
    gap: 24px;
    min-width: 0;
    flex: 1;
}

.app-header h1 {
    color: #ffffff;
    font-size: 20px;
    white-space: nowrap;
    flex-shrink: 0;
}

.app-header nav ul {
    list-style: none;
    display: flex;
    gap: 8px;
    margin: 0;
    padding: 0;
}

.app-header nav a {
    color: #d5d5d5;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 14px;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
}

.app-header nav a:hover {
    background: #3d566e;
    color: #ffffff;
}

.app-header nav a.active {
    background: #3498db;
    color: #ffffff;
}

.app-header-right {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

/* ── Responsive ──────────────────────────────────────────────── */

@media (max-width: 768px) {
    .app-header {
        flex-direction: column;
        gap: 12px;
        padding: 12px 16px;
    }

    .app-header-left {
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    .app-header nav ul {
        flex-wrap: wrap;
        justify-content: center;
    }
}
</style>

<script>
// ── Theme management ──
function getTheme() {
    return localStorage.getItem('theme') || 'dark';
}

function setTheme(theme) {
    if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
    } else {
        document.documentElement.removeAttribute('data-theme');
    }
    localStorage.setItem('theme', theme);
}

function toggleTheme() {
    var current = getTheme();
    var next = current === 'dark' ? 'light' : 'dark';
    setTheme(next);
    applyThemeToggle(next);
    var emojiLabel = document.getElementById('theme-emoji-label');
    if (emojiLabel) {
        emojiLabel.textContent = next === 'light' ? '☀️' : '🌙';
    }
}

          function applyThemeToggle(theme) {
               var toggle = document.getElementById('theme-toggle');
               if (toggle) {
                   toggle.checked = (theme === 'light');
               }
           }

// Initialize theme on page load
(function() {
    var theme = getTheme();
    setTheme(theme);
    applyThemeToggle(theme);
    var emojiLabel = document.getElementById('theme-emoji-label');
    if (emojiLabel) {
        emojiLabel.textContent = theme === 'light' ? '☀️' : '🌙';
    }
})();
</script>
