[pytest]
asyncio_mode = auto
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[coverage:run]
source = ["src"]
omit = ["*/tests/*", "*/mypy.ini"]

[coverage:report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]