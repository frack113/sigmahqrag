os = "windows"

[backend]
gpu_type = "hip"
os = "windows"
llamacpp_version = "b9085"
qdrant_version = "1.17.1"

[models]
llm_dir = "data/models/llm"
embeddings_dir = "data/models/embeddings"

[services.llamacpp]
binary_path= "data/bin/llamacpp"
base_url = "http://127.0.0.1:8080"

[services.qdrant]
binary_path= "data/bin/qdrant"
config_path= "data/bin/qdrant/config"
host = "127.0.0.1"
port = 6333
collection_name = "sigma"
vector_size = 384
disable-telemetry = true
storage_path = "data/qdrant_storage/database"
snapshots_path = "data/qdrant_storage/snapshots"

[paths]
bin_dir = "data/bin"
models_dir = "data/models"
logs_dir = "data/logs"

[logging]
level = "INFO"
display_source = "system"
display_level = ""
display_nb_line = 25
