os = "windows"

[backend]
gpu_type = "hip"
os = "windows"
llamacpp_version = "b9085"
qdrant_version = "1.17.1"

[models]
llm_dir = "data/models/llm"
embeddings_dir = "data/models/embeddings"

[services.llama]
base_url = "http://127.0.0.1:8080"

[services.qdrant]
host = "127.0.0.1"
port = 6334
collection_name = "sigma"
vector_size = 384
disable-telemetry = true

[paths]
bin_dir = "data/bin"
models_dir = "data/models"
logs_dir = "data/logs"

[logging]
level = "INFO"
display_source = "system"
display_level = ""
display_nb_line = 25
