[project]
name = "sigmahqrag"
version = "0.1.0"
description = "Local RAG system for Sigma rules"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "llama-index==0.14.21",
    "llama-index-vector-stores-qdrant==0.10.0",
    "llama-index-llms-llamafile==0.5.0",
    "llama-index-embeddings-huggingface==0.7.0",
    "gitpython==3.1.44",
    "python-jose==3.3.0",
    "huggingface-hub==0.33.5",
    "tomli-w==1.2.0",
    "psutil==7.0.0",
    "uvicorn>=0.46.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.27",
    "hf-xet>=1.4.3",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
