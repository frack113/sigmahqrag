[project]
name = "sigmahqrag"
version = "0.1.0"
description = "Local RAG system for Sigma rules"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "llama-index==0.14.21",
    "llama-index-vector-stores-qdrant==0.10.0",
    "llama-index-llms-llamafile==0.5.0",
    "llama-index-embeddings-huggingface>=0.6.0,<0.7",
    "llama-index-embeddings-openvino==0.7.0",
    "gitpython==3.1.44",
    "python-jose==3.3.0",
    "huggingface-hub==0.33.5",
    "tomli-w==1.2.0",
    "psutil==7.0.0",
    "uvicorn>=0.46.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.27",
    "hf-xet>=1.4.3",
    "jinja2>=3.1.6",
    "puremagic>=2.2.0",
    "pyyaml>=6.0",
    "duckdb>=1.5.2",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*.sql"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.sigmahqrag.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.sigmahqrag.services.*"
disallow_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "gradio"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llama_index"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "huggingface_hub"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.black]
target-version = ["py312"]
line-length = 100
