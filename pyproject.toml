[project]
name = "sigmahqrag"
version = "0.1.0"
description = "Local RAG system for Sigma rules"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "gradio>=6.11",
    "llama-index>=0.14",
    "llama-index-vector-stores-qdrant",
    "llama-index-llms-llamafile",
    "llama-index-embeddings-huggingface",
    "gitpython",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch]
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]