[project]
name = "sigmahqrag"
version = "0.1.0"
description = "Local RAG system for Sigma rules"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "gradio>=6.11",
    "llama-index",
    "llama-index-vector-stores-qdrant",
    "llama-index-llms-llamafile",
    "llama-index-embeddings-huggingface",
    "gitpython",
    "python-jose",
    "huggingface-hub",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
